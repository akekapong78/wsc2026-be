<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>wsc2026-be — Swagger UI</title>
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
<div style="padding:.5rem 1rem;font-family:system-ui,sans-serif;display:flex;gap:1.5rem;align-items:center">
  <label>Spec:
    <select id="spec-select">
      <option value="oms">Operational — /api/v1/oms/...</option>
      <option value="oms-admin">Admin — /api/v1/oms/admin/...</option>
    </select>
  </label>
  <label>X-API-Key:
    <input id="api-key" type="text" size="40" placeholder="paste API_KEY from .env"
      onchange="localStorage.setItem('wsc2026-be-api-key', this.value)">
  </label>
</div>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/js-yaml@4/dist/js-yaml.min.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
  const keyInput = document.getElementById('api-key');
  keyInput.value = localStorage.getItem('wsc2026-be-api-key') || '';

  const specSelect = document.getElementById('spec-select');

  // Each spec describes a different real server (spec/oms.openapi.yaml is
  // the future standalone OMS, spec/oms-admin.openapi.yaml already points
  // at this gateway) — always override servers/paths to this gateway's
  // actual mount point before rendering, so the operation list, curl
  // preview, and "Try it out" all agree with what actually gets called.
  const REWRITE = {
    oms: (doc) => {
      doc.servers = [{ url: location.origin + '/api/v1/oms', description: 'this gateway (wsc2026-be)' }];
      doc.paths = Object.fromEntries(
        Object.entries(doc.paths).map(([path, item]) => [path.replace(/^\/api\/v1/, ''), item])
      );
    },
    'oms-admin': (doc) => {
      doc.servers = [{ url: location.origin, description: 'this gateway (wsc2026-be)' }];
    },
  };

  async function loadSpec(name) {
    const text = await (await fetch(`/spec/${name}.openapi.yaml`)).text();
    const doc = jsyaml.load(text);
    REWRITE[name](doc);

    SwaggerUIBundle({
      spec: doc,
      dom_id: '#swagger-ui',
      presets: [SwaggerUIBundle.presets.apis],
      requestInterceptor: (req) => {
        req.headers['X-API-Key'] = keyInput.value;
        return req;
      },
    });
  }

  specSelect.addEventListener('change', () => loadSpec(specSelect.value));
  window.onload = () => loadSpec(specSelect.value);
</script>
</body>
</html>
